# ─── Render Blueprint (render.yaml) ──────────────────────────────────────
# Declares both services as `runtime: docker` so Render builds from our
# production Dockerfiles and runs the image CMDs — it will NOT run its own
# buildpack install (which installed the full 329-package devDep tree from
# the root package.json and OOM'd with status 137).
#
# Schema notes (Render Blueprint spec):
#   - `type: web` = service category; `runtime: docker` = build from Dockerfile
#   - Docker services support ONLY: dockerfilePath, dockerContext, dockerCommand
#   - There is NO build-args field in the Blueprint schema. Build-time env
#     vars (DATABASE_URL for the Prisma provider, VITE_API_BASE_URL for the
#     frontend bundle) are set in the Render dashboard per service under
#     Settings → Environment → "Build Environment Variables".
#
# Deploy: New → Blueprint from this repo, then fill the secrets below.

services:
  # ─── Backend API (NestJS + Prisma) ──────────────────────────────────
  - type: web
    name: resume-backend
    runtime: docker
    repo: https://github.com/dn54321/resume-v3
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # ⚠️ Set DATABASE_URL as a BUILD env var in the dashboard (it selects
    # the Prisma provider: postgresql:// → postgres, file: → sqlite).
    # Render injects PORT; the app binds 0.0.0.0. 401 is the auth-gated
    # health response (a 200 on an unauthenticated GET isn't expected).
    healthCheckPath: /api/v1/resumes
    autoDeploy: true
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false # Render sets this
      - key: DATABASE_URL
        sync: false # set in dashboard (e.g. Neon Postgres)
      - key: FRONTEND_URL
        sync: false # your frontend URL, e.g. https://resumes.onrender.com
      - key: RESUME_FIELD_ENCRYPTION_KEY
        sync: false # 64-hex AES-256-GCM (./gen-key.sh)
      - key: SESSION_ENCRYPTION_KEY
        sync: false # 64-hex AES-256-GCM
      - key: MATCHING_ENGINE
        value: keyword
      - key: BULLET_CAP
        value: "5"

  # ─── Frontend (Vite build → nginx) ──────────────────────────────────
  - type: web
    name: resume-frontend
    runtime: docker
    repo: https://github.com/dn54321/resume-v3
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    # ⚠️ Set VITE_API_BASE_URL as a BUILD env var in the dashboard — it is
    # baked into the JS bundle and must be the backend's public URL.
    # nginx listens on $PORT (envsubst at boot) — Render routes here.
    healthCheckPath: /
    autoDeploy: true
    plan: starter
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # your API URL, e.g. https://resume-backend.onrender.com
