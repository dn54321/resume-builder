<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background fill — dark slate for visibility on any browser chrome -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>

  <!-- Back page (offset behind front) -->
  <rect x="2" y="1" width="26" height="28" rx="3" fill="#475569" opacity="0.35"/>

  <!-- Front page -->
  <rect x="4" y="3" width="26" height="28" rx="3" fill="#f8fafc" opacity="0.95"/>

  <!-- Content lines on front page -->
  <rect x="9" y="9" width="12" height="2" rx="1" fill="#94a3b8" opacity="0.9"/>
  <rect x="9" y="14" width="16" height="2" rx="1" fill="#94a3b8" opacity="0.5"/>
  <rect x="9" y="19" width="10" height="2" rx="1" fill="#94a3b8" opacity="0.5"/>

  <!-- Accent bar — brand primary amber/gold -->
  <rect x="9" y="3" width="4" height="3" rx="1" fill="#f59e0b"/>
</svg>
