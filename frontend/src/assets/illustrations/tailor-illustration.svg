<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="AI tailoring illustration">
  <defs>
    <linearGradient id="tailorGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-amber-400, #fbbf24)"/>
      <stop offset="100%" stop-color="var(--color-amber-500, #f59e0b)"/>
    </linearGradient>
    <linearGradient id="tailorGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--color-rose-400, #fb7185)"/>
      <stop offset="100%" stop-color="var(--color-rose-300, #fda4af)"/>
    </linearGradient>
    <filter id="tailorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="95" r="75" fill="url(#tailorGrad1)" opacity="0.08"/>

  <!-- Target / bullseye -->
  <circle cx="100" cy="95" r="42" stroke="url(#tailorGrad1)" stroke-width="3" fill="none"/>
  <circle cx="100" cy="95" r="28" stroke="url(#tailorGrad1)" stroke-width="2.5" fill="none"/>
  <circle cx="100" cy="95" r="14" stroke="url(#tailorGrad1)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="95" r="5" fill="url(#tailorGrad2)"/>

  <!-- Crosshairs -->
  <line x1="100" y1="40" x2="100" y2="48" stroke="url(#tailorGrad1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="142" x2="100" y2="150" stroke="url(#tailorGrad1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="95" x2="53" y2="95" stroke="url(#tailorGrad1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="147" y1="95" x2="155" y2="95" stroke="url(#tailorGrad1)" stroke-width="2" stroke-linecap="round"/>

  <!-- Magic sparkles around the target -->
  <g filter="url(#tailorGlow)">
    <path d="M60 50l2 5 5 0.5-3.5 3.5 0.8 5-4.3-2.3-4.3 2.3 0.8-5-3.5-3.5 5-0.5z" fill="url(#tailorGrad2)" opacity="0.8"/>
    <path d="M145 140l1.5 3.5 3.5 0.4-2.5 2.5 0.6 3.5-3-1.6-3 1.6 0.6-3.5-2.5-2.5 3.5-0.4z" fill="url(#tailorGrad1)" opacity="0.8"/>
    <path d="M145 55l1.5 3.5 3.5 0.4-2.5 2.5 0.6 3.5-3-1.6-3 1.6 0.6-3.5-2.5-2.5 3.5-0.4z" fill="url(#tailorGrad2)" opacity="0.6"/>
    <circle cx="65" cy="140" r="2" fill="url(#tailorGrad1)" opacity="0.7"/>
    <circle cx="50" cy="100" r="1.5" fill="url(#tailorGrad2)" opacity="0.6"/>
    <circle cx="150" cy="90" r="2" fill="url(#tailorGrad1)" opacity="0.5"/>
  </g>

  <!-- Document icon in the center (small) -->
  <g transform="translate(82, 77)">
    <rect x="0" y="0" width="36" height="42" rx="3" fill="currentColor" stroke="url(#tailorGrad1)" stroke-width="1.5"/>
    <rect x="6" y="12" width="24" height="3" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.5"/>
    <rect x="6" y="19" width="18" height="2.5" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.4"/>
    <rect x="6" y="25" width="22" height="2.5" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.4"/>
  </g>
</svg>
