<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="PDF export illustration">
  <defs>
    <linearGradient id="exportGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-amber-400, #fbbf24)"/>
      <stop offset="100%" stop-color="var(--color-amber-500, #f59e0b)"/>
    </linearGradient>
    <linearGradient id="exportGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-rose-400, #fb7185)"/>
      <stop offset="100%" stop-color="var(--color-rose-300, #fda4af)"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="95" r="75" fill="url(#exportGrad1)" opacity="0.08"/>

  <!-- Document -->
  <rect x="50" y="60" width="100" height="75" rx="6" fill="currentColor" stroke="url(#exportGrad1)" stroke-width="2"/>
  <!-- Document top bar -->
  <rect x="50" y="60" width="100" height="5" rx="2.5" fill="url(#exportGrad1)"/>

  <!-- PDF badge -->
  <rect x="58" y="74" width="28" height="12" rx="3" fill="url(#exportGrad2)" opacity="0.85"/>
  <text x="72" y="83" font-family="sans-serif" font-size="8" font-weight="700" fill="white" text-anchor="middle">PDF</text>

  <!-- Content lines -->
  <rect x="58" y="94" width="82" height="3" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.4"/>
  <rect x="58" y="102" width="68" height="2.5" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>
  <rect x="58" y="109" width="75" height="2.5" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>
  <rect x="58" y="116" width="55" height="2.5" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>

  <!-- Download arrow -->
  <g>
    <!-- Arrow shaft -->
    <line x1="100" y1="148" x2="100" y2="170" stroke="url(#exportGrad2)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M90 164l10 10 10-10" stroke="url(#exportGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Motion lines above arrow -->
    <path d="M90 150l-4-6" stroke="url(#exportGrad1)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M100 147v-8" stroke="url(#exportGrad1)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M110 150l4-6" stroke="url(#exportGrad1)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Decorative swoosh near PDF badge -->
  <path d="M56 78c-5-3-8 2-10 5" stroke="url(#exportGrad2)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
