<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" role="img" aria-label="Resume builder hero illustration">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-amber-400, #fbbf24)"/>
      <stop offset="100%" stop-color="var(--color-amber-500, #f59e0b)"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-rose-400, #fb7185)"/>
      <stop offset="100%" stop-color="var(--color-rose-300, #fda4af)"/>
    </linearGradient>
    <linearGradient id="heroGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--color-amber-300, #fcd34d)"/>
      <stop offset="100%" stop-color="var(--color-rose-300, #fda4af)"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="heroSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background blobs -->
  <ellipse cx="420" cy="100" rx="180" ry="140" fill="url(#heroGrad2)" opacity="0.12"/>
  <ellipse cx="150" cy="380" rx="200" ry="160" fill="url(#heroGrad3)" opacity="0.1"/>
  <circle cx="480" cy="400" r="120" fill="url(#heroGrad2)" opacity="0.08"/>
  <ellipse cx="80" cy="150" rx="100" ry="80" fill="url(#heroGrad1)" opacity="0.08"/>

  <!-- Floating sparkles -->
  <g filter="url(#heroGlow)">
    <circle cx="120" cy="80" r="3" fill="url(#heroGrad1)"/>
    <circle cx="500" cy="60" r="2.5" fill="url(#heroGrad2)"/>
    <circle cx="530" cy="200" r="2" fill="url(#heroGrad1)"/>
    <circle cx="430" cy="420" r="2.5" fill="url(#heroGrad2)"/>
    <circle cx="160" cy="440" r="3" fill="url(#heroGrad1)"/>
    <circle cx="70" cy="280" r="2" fill="url(#heroGrad2)"/>
    <circle cx="350" cy="50" r="2" fill="url(#heroGrad1)" opacity="0.7"/>
    <circle cx="560" cy="350" r="2" fill="url(#heroGrad2)" opacity="0.6"/>
  </g>

  <!-- Star shapes -->
  <g filter="url(#heroGlow)">
    <path d="M480 130l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="url(#heroGrad1)" opacity="0.9"/>
    <path d="M140 340l2 5 5 0.5-3.5 3.5 0.8 5-4.3-2.3-4.3 2.3 0.8-5-3.5-3.5 5-0.5z" fill="url(#heroGrad2)" opacity="0.7"/>
    <path d="M530 310l2 4 4.5 0.5-3.2 3 0.7 4.5-4-2-4 2 0.7-4.5-3.2-3 4.5-0.5z" fill="url(#heroGrad1)" opacity="0.6"/>
  </g>

  <!-- Main document / resume -->
  <g filter="url(#heroSoftGlow)">
    <!-- Document shadow -->
    <rect x="225" y="140" width="190" height="250" rx="8" fill="var(--color-stone-300, #d6d3d1)" opacity="0.3" transform="rotate(-3, 320, 265)"/>

    <!-- Document body -->
    <rect x="220" y="130" width="190" height="250" rx="8" fill="currentColor" stroke="var(--color-amber-400, #fbbf24)" stroke-width="2"/>

    <!-- Document header accent bar -->
    <rect x="220" y="130" width="190" height="6" rx="3" fill="url(#heroGrad1)"/>

    <!-- Document content lines -->
    <rect x="240" y="155" width="150" height="10" rx="3" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.6"/>
    <rect x="240" y="175" width="100" height="8" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.4"/>
    <rect x="240" y="200" width="150" height="6" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>
    <rect x="240" y="215" width="150" height="6" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>
    <rect x="240" y="230" width="130" height="6" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>

    <!-- Section divider -->
    <rect x="240" y="250" width="150" height="1" fill="var(--color-border, #e7e5e4)" opacity="0.5"/>
    <rect x="240" y="262" width="90" height="8" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.4"/>

    <!-- Bullet items -->
    <circle cx="248" cy="285" r="2.5" fill="url(#heroGrad1)"/>
    <rect x="256" y="282" width="110" height="6" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>
    <circle cx="248" cy="300" r="2.5" fill="url(#heroGrad1)"/>
    <rect x="256" y="297" width="90" height="6" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>
    <circle cx="248" cy="315" r="2.5" fill="url(#heroGrad1)"/>
    <rect x="256" y="312" width="120" height="6" rx="2" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.3"/>

    <!-- Checkmark badge -->
    <circle cx="380" cy="340" r="16" fill="url(#heroGrad1)" opacity="0.9"/>
    <path d="M372 340l5 5 10-10" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating decorative element: abstract swoosh -->
  <path d="M105 200c20-15 40-25 60-20 25 6 40 30 55 45 12 12 25 20 35 15" stroke="url(#heroGrad2)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Small floating card/details -->
  <g opacity="0.7">
    <rect x="410" y="170" width="60" height="40" rx="6" fill="var(--color-background, white)" stroke="url(#heroGrad2)" stroke-width="1.5" transform="rotate(8, 440, 190)"/>
    <circle cx="430" cy="185" r="4" fill="url(#heroGrad2)"/>
    <rect x="440" y="183" width="20" height="4" rx="1" fill="var(--color-muted-foreground, #a8a29e)" opacity="0.5"/>
  </g>
</svg>
