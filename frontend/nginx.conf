# ─── Frontend nginx (inside the container) — serves the built Vue SPA ────
# The droplet's HOST nginx terminates TLS and proxies to this container on
# :80, so this file only has one job: serve static files fast and cache
# them correctly.
#
# Caching rules:
#   /assets/*   — hashed filenames (Vite fingerprints), safe to cache 1y
#   /index.html — never cached; a new deploy must be picked up immediately
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compression (the host proxy passes Content-Encoding through untouched)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # SPA fallback — unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets: immutable, cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML shell must always be revalidated
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Favicons — tiny, rarely change
    location = /favicon.svg { expires 7d; add_header Cache-Control "public"; }
    location = /favicon.ico { expires 7d; add_header Cache-Control "public"; }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
