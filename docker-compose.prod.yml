# ─── Resume Builder — Docker Compose (Production / DigitalOcean Droplet) ──
#
# Deploys the whole stack on a single droplet:
#   postgres:16  ←  backend (NestJS)  ←  host nginx (TLS)  →  frontend (nginx)
#
# Sized for a 1GB RAM droplet: idle stack ~500MB (Postgres ~180MB, backend
# ~250MB, two nginx ~25MB, dockerd ~60MB) with the setup script's 2G swap
# covering build-time spikes. The backend heap is capped at 512MB and the
# postgres buffers/connections trimmed so nothing can balloon past RAM.
#
# Usage (run from the repo root ON the droplet):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The env file is created by deploy/setup-droplet.sh (or hand-made from
# .env.prod.template). Every ${VAR} below is interpolated from that file —
# nothing is hardcoded here.
#
# Networking:
#   - The host nginx (installed by deploy/setup-droplet.sh) is the ONLY
#     public entry point (ufw: 22/80/443). Backend and frontend are
#     published on 127.0.0.1 so the host proxy can reach them but the
#     internet cannot.
#   - Single-origin layout: the browser only ever talks to https://<domain>.
#     Host nginx routes / to the frontend container and /api/v1 to the
#     backend, so auth cookies work with zero CORS/SameSite gymnastics
#     (backend FRONTEND_URL == frontend VITE_API_BASE_URL == the domain).
#
# Logs: json-file rotation (10MB × 3 per container) keeps a busy droplet's
# disk from filling up — the classic single-droplet failure mode.

name: resume-builder-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Database (Postgres 16, persisted in a named volume) ──────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Trimmed for a 1GB droplet: 64MB shared buffers (vs 128MB default) and
    # 50 max connections (vs 100) — Prisma's pool needs only a handful.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-resume_builder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume} -d ${POSTGRES_DB:-resume_builder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Backend (NestJS + Prisma, Postgres provider) ─────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Selects the Prisma provider at BUILD time (set-db-provider.js):
        # postgresql:// → postgres. Must match the runtime DATABASE_URL.
        DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Heap cap: stops a runaway backend from ballooning past the 1GB
      # droplet's RAM (the app idles well under 300MB).
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.prod}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env.prod}
      MATCHING_ENGINE: ${MATCHING_ENGINE:-keyword}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      BULLET_CAP: ${BULLET_CAP:-5}
      RESUME_FIELD_ENCRYPTION_KEY: ${RESUME_FIELD_ENCRYPTION_KEY:?set RESUME_FIELD_ENCRYPTION_KEY in .env.prod}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?set SESSION_ENCRYPTION_KEY in .env.prod}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # 401 (unauthenticated) is a healthy response; anything >= 500 is not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/resumes').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s # prisma migrate deploy runs in CMD before the app boots
    logging: *default-logging

  # ─── Frontend (built Vue SPA, served by nginx on :80) ─────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the JS bundle at build time. Same origin as FRONTEND_URL
        # (https://<domain>) — host nginx routes / here and /api/v1 to the
        # backend, so the browser never leaves the origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env.prod}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  pgdata:
