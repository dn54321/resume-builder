name: Deploy to Droplet

# ⚠️ WARNING — this run script is DESTRUCTIVE if executed locally.
# It writes $DROPLET_SSH_KEY over ~/.ssh/id_ed25519 (GitHub-runners only
# receive the secret). Never `eval` it, never source it, never copy-paste
# it into a local shell. Real incident: a local simulation of this script
# overwrote the machine's real SSH private key with the literal text
# "dummy" (2026-08-06) — the key had to be regenerated and re-registered
# on GitHub + the droplet. To inspect what the remote will receive, only
# READ the file / substitute variables in a throwaway dir.

on:
  push:
    # ANY release line deploys: release/v1.0.0, release/v1.0.1,
    # release/v2.0.0… Cutting a new release branch needs zero changes here.
    # Pushes to `master` and PRs never deploy. The job derives the exact
    # branch from the pushed ref (github.ref_name) instead of hard-coding
    # it, so release-branch bumps can't silently stop deploying.
    branches: [release/**]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy on the droplet
    runs-on: ubuntu-latest
    # Never run two deploys at once (git hard-sync + compose up are not
    # safe to interleave)
    concurrency: droplet-deploy
    # Only release branches deploy — a manual dispatch from master skips.
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Deploy via SSH
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          # e.g. release/v1.0.1 — whatever branch this run was triggered on
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$DROPLET_HOST" ] || { echo "missing secret DROPLET_HOST" >&2; exit 1; }
          [ -n "$DROPLET_USER" ] || { echo "missing secret DROPLET_USER" >&2; exit 1; }
          [ -n "$DROPLET_SSH_KEY" ] || { echo "missing secret DROPLET_SSH_KEY" >&2; exit 1; }

          # ⚠️ GUARDRAIL (added after a real incident, 2026-08-06): the
          # deploy key is written to a MKTEMP file — NEVER to
          # ~/.ssh/id_ed25519. On a GitHub runner the path doesn't matter,
          # but if this step is ever evaled/sourced locally, writing to
          # ~/.ssh/id_ed25519 would destroy the machine's real SSH key
          # (that's exactly what happened — a local simulation overwrote
          # the key with the literal text "dummy"). mktemp confines any
          # accidental local run to /tmp, the trap deletes the files, and
          # ssh-keygen validates the secret before any connection.
          SSH_KEY_FILE="$(mktemp)"
          KNOWN_HOSTS_FILE="$(mktemp)"
          trap 'rm -f "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE"' EXIT
          printf '%s\n' "$DROPLET_SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          ssh-keygen -y -f "$SSH_KEY_FILE" >/dev/null 2>&1 \
            || { echo "DROPLET_SSH_KEY is not a valid SSH private key" >&2; exit 1; }
          ssh-keyscan -H "$DROPLET_HOST" > "$KNOWN_HOSTS_FILE" 2>/dev/null || true

          ssh -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              -o BatchMode=yes -o IdentitiesOnly=yes -i "$SSH_KEY_FILE" \
              "$DROPLET_USER@$DROPLET_HOST" '
            set -euo pipefail
            cd ~/resume-v3
            # Hard-sync to the release branch: the droplet is a single-
            # purpose deploy box (all state lives in .env.prod + the pgdata
            # volume, both gitignored), so resetting tracked files is always
            # safe and guarantees we build EXACTLY what the push contains —
            # even after a force-push or a stray commit on the droplet.
            # Never add `git clean` here (it would delete .env.prod).
            git fetch origin '"$DEPLOY_BRANCH"'
            git checkout -f '"$DEPLOY_BRANCH"'
            git reset --hard origin/'"$DEPLOY_BRANCH"'
            echo "Deploying '"$DEPLOY_BRANCH"' @ $(git log -1 --oneline)"
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps --status running
          '
