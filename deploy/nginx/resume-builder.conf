# ─── Resume Builder — host reverse proxy (DigitalOcean droplet) ───────────
# Installed by deploy/setup-droplet.sh to
#   /etc/nginx/sites-available/resume-builder   (+ symlink in sites-enabled)
# with DOMAIN substituted. certbot --nginx upgrades this block to TLS
# (adds the 443 server + redirect + managed certificate paths); renewals
# run automatically via certbot's systemd timer. Do NOT hand-edit the
# ssl_* lines certbot adds.
#
# Routing (single origin — the browser only talks to https://DOMAIN):
#   /api/v1/*  → backend container  (127.0.0.1:3000)
#   /*         → frontend container (127.0.0.1:8080)
#
# Both containers publish on loopback only, so ufw + this proxy are the
# only public path into the stack.
server {
    listen 80;
    server_name DOMAIN;

    # Tailor's LLM engine calls an external API — allow slow responses
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
